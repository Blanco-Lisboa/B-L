<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova senha — Blanco & Lisboa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --navy-900:#011D3A; --navy-700:#16395F; --gold-500:#EDB449; --gold-600:#D99F30;
    --paper:#F6F8FA; --ink:#101820; --ink-2:#3D4854; --muted:#6B7684; --line:#E1E6EB;
    --serif:'Archivo','Segoe UI',Arial,sans-serif; --sans:'Public Sans','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);
    background:radial-gradient(120% 85% at 0% 0%,rgba(237,180,73,.16),rgba(237,180,73,0) 52%),linear-gradient(160deg,#03294f 0%,#011D3A 55%,#01152b 100%);
    display:grid;place-items:center;min-height:100vh}
  .card{width:400px;max-width:92vw;background:var(--paper);border-radius:14px;padding:34px 32px;
    box-shadow:0 22px 60px rgba(0,0,0,.35);text-align:center}
  .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px}
  .bt{text-align:left}
  .mark{width:84px;height:84px;display:grid;place-items:center}
  .bt b{display:block;font-family:var(--serif);font-weight:900;font-size:15px;color:var(--navy-900);letter-spacing:.02em;line-height:1.05}
  .bt span{display:block;font-family:var(--serif);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--gold-600)}
  h1{font-family:var(--serif);font-weight:800;font-size:20px;margin:0 0 4px;color:var(--ink)}
  .sub{font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.5}
  .aviso{margin:14px 0 4px;padding:10px 12px;border-radius:8px;background:#FBF1DC;border:1px solid #E0A62B;color:#6b4e12;font-size:12px;text-align:left}
  label.fld{display:block;text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 6px}
  input[type=password]{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 13px;font:inherit;font-size:14px;color:var(--ink);background:#fff;text-align:left}
  input:focus{outline:0;border-color:var(--navy-700);box-shadow:0 0 0 3px rgba(37,75,116,.22)}
  .regra{font-size:11px;color:var(--muted);margin-top:6px;text-align:left}
  .btn{width:100%;margin-top:20px;border:0;border-radius:8px;padding:13px;background:var(--navy-900);color:#F4F7FA;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--navy-700)}
  .btn:disabled{opacity:.6;cursor:default}
  .err{margin-top:14px;font-size:13px;color:#D64545;min-height:18px;text-align:center}
  .msg{margin-top:6px;font-size:12.5px;color:#2E9E5B;min-height:16px;text-align:center}
  .sair{margin-top:14px;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit}
</style></head>
<body>
  <div class="card">
    <div class="brand"><div class="mark"><img src="logo-bl.png" alt="Blanco &amp; Lisboa" style="width:100%;height:100%;object-fit:contain"></div></div>
    <h1>Escolha sua nova senha</h1>
    <div class="sub">Você entrou com uma senha provisória. Defina agora sua senha definitiva para continuar.</div>
    <form id="f" autocomplete="off">
      <label class="fld" for="s1">Nova senha</label>
      <input id="s1" type="password" autocomplete="new-password" required>
      <div class="regra">Pelo menos 8 caracteres.</div>
      <label class="fld" for="s2">Confirmar nova senha</label>
      <input id="s2" type="password" autocomplete="new-password" required>
      <button class="btn" id="go" type="submit">Salvar e entrar</button>
      <div class="err" id="err" role="alert"></div>
      <div class="msg" id="msg"></div>
    </form>
    <button class="sair" id="sair" type="button">Sair e voltar pro login</button>
  </div>
  <script>
    var SUPA_URL = 'https://wfqcoocfastgsfgegpcm.supabase.co';
    var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcWNvb2NmYXN0Z3NmZ2VncGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0OTI2MTcsImV4cCI6MjEwNTA2ODYxN30.31bgQ0VWxDzck3G6BZJrQZbf8OAv4AOKQZPfjaroPmk';
    var TROCAR_URL = 'https://wfqcoocfastgsfgegpcm.supabase.co/functions/v1/ceo-trocar-senha';
    var f = document.getElementById('f'), err = document.getElementById('err'), msg = document.getElementById('msg'), go = document.getElementById('go');
    var s1 = document.getElementById('s1'), s2 = document.getElementById('s2');

    function sessaoAtual() {
      try { return JSON.parse(sessionStorage.getItem('bl_sessao') || 'null'); } catch (e) { return null; }
    }
    var sessao = sessaoAtual();
    var emailAtual = null;
    try {
      var svLogin = JSON.parse(localStorage.getItem('bl_login') || 'null');
      emailAtual = svLogin && svLogin.email;
    } catch (e) {}
    if (!sessao || !sessao.access_token) { window.location.href = 'login.html'; }

    document.getElementById('sair').addEventListener('click', function () {
      try { sessionStorage.removeItem('bl_sessao'); localStorage.removeItem('bl_login'); } catch (e) {}
      window.location.href = 'login.html';
    });

    f.addEventListener('submit', function (e) {
      e.preventDefault(); err.textContent = ''; msg.textContent = '';
      var p1 = s1.value, p2 = s2.value;
      if (p1.length < 8) { err.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
      if (p1 !== p2) { err.textContent = 'As duas senhas não são iguais.'; return; }
      go.disabled = true; go.textContent = 'Salvando...';
      fetch(TROCAR_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: sessao.access_token, nova_senha: p1 })
      })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j || !res.j.ok) {
          err.textContent = (res.j && res.j.erro) || 'Não foi possível salvar a senha agora.';
          go.disabled = false; go.textContent = 'Salvar e entrar';
          return;
        }
        // pega uma sessão nova, já com a senha definitiva, pra garantir token válido
        var email = emailAtual;
        var seguir = function () { window.location.href = 'painel.html'; };
        if (!email) {
          try {
            fetch(SUPA_URL + '/auth/v1/user', { headers: { apikey: ANON, Authorization: 'Bearer ' + sessao.access_token } })
              .then(function (r) { return r.json(); }).then(function (u) { email = u && u.email; relogar(); }).catch(seguir);
          } catch (e) { seguir(); }
        } else { relogar(); }
        function relogar() {
          if (!email) { seguir(); return; }
          fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
            method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON },
            body: JSON.stringify({ email: email, password: p1 })
          })
          .then(function (r) { return r.json(); })
          .then(function (novo) {
            if (novo && novo.access_token) {
              try { sessionStorage.setItem('bl_sessao', JSON.stringify(novo)); } catch (e) {}
              try {
                var sv = JSON.parse(localStorage.getItem('bl_login') || 'null');
                if (sv) localStorage.setItem('bl_login', JSON.stringify({ email: email, refresh_token: novo.refresh_token }));
              } catch (e) {}
            }
            seguir();
          }).catch(seguir);
        }
        msg.textContent = 'Senha salva! Entrando...';
      })
      .catch(function () { err.textContent = 'Falha de conexão. Tente de novo.'; go.disabled = false; go.textContent = 'Salvar e entrar'; });
    });
  </script>
</body></html>
