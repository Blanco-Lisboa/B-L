# Roda sem banco por padrão (dados semeados em GrupoService).
# A API Spring sobe em http://localhost:8080 (ex.: /api/empresas).
server.port=8080
spring.application.name=painel-bl

# Sem banco: desliga a auto-config de datasource/JPA.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Para ligar no Supabase (Postgres), rode com o perfil db:  mvn -Pdb spring-boot:run
# e preencha application-db.properties (host/senha do projeto ERP - YOU CONTABILIDADE).

# UTF-8 como padrao nas respostas de texto (login.html/painel.html ja tem
# <meta charset="utf-8"> proprio). NAO forcar (force=true quebrava arquivos
# binarios como .png, que passavam a vir com "charset=UTF-8" no Content-Type
# e o navegador recusava renderizar a imagem).
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=false
